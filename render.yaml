# Render Blueprint for CollabDocs.
# Creates one web service (the Next.js app: frontend + backend API) and one
# PostgreSQL database, and wires DATABASE_URL between them.
#
# Deploy: Render Dashboard → New → Blueprint → choose this repository → Apply.
# Free plan limits: the web service sleeps after 15 idle minutes (about a
# minute to wake), and the free database expires 30 days after creation.

databases:
  - name: collabdocs-db
    databaseName: collabdocs
    user: collabdocs
    plan: free

services:
  - type: web
    name: collabdocs
    runtime: node
    plan: free
    # --include=dev: the build needs TypeScript and Tailwind even when
    # NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # Apply the schema (idempotent), then start. next start reads $PORT.
    startCommand: node scripts/migrate.mjs && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: collabdocs-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
